<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>美食大進化</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-title">✦ 美食大進化 ✦</div>
  <div class="header-sub">合併美食 · 推動料理演化</div>
</header>

<div class="container">

  <!-- Score Row -->
  <div class="score-row">
    <div class="score-card">
      <div class="score-label">分數</div>
      <span class="score-value" id="score-val">0</span>
    </div>
    <div class="score-card">
      <div class="score-label">最高分</div>
      <span class="score-value" id="best-val">0</span>
    </div>
    <div class="score-card">
      <div class="score-label">最高進化</div>
      <span class="score-value" id="best-food-val" style="font-size:0.85rem">—</span>
    </div>
  </div>

  <!-- Control Buttons -->
  <div class="btn-row">
    <button class="btn btn-new" id="btn-new">🔄 新遊戲</button>
    <button class="btn btn-undo" id="btn-undo">↩ 復原</button>
    <button class="btn btn-help" id="btn-help">? 玩法</button>
  </div>

  <!-- Game Board -->
  <div class="board-wrap">
    <div id="board">
      <!-- 16 cells generated by JS -->
    </div>
    <!-- Game Over / Win Overlay -->
    <div class="overlay" id="overlay">
      <div class="overlay-title" id="overlay-title"></div>
      <div class="overlay-sub" id="overlay-sub"></div>
      <button class="overlay-btn" id="overlay-btn">再試一次</button>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-label">進化進度</span>
      <span id="progress-text">0 / 12</span>
    </div>
    <div class="progress-track">
      <div id="progress-fill"></div>
    </div>
  </div>

  <!-- Next Target -->
  <div class="next-target">
    <span class="next-star">⭐</span>
    <div>
      <div class="next-label">下一個目標</div>
      <div id="next-target-name">小麥</div>
    </div>
    <canvas id="next-target-canvas" width="32" height="32"></canvas>
  </div>

</div>

<!-- Help Modal -->
<div class="modal-backdrop" id="help-modal">
  <div class="modal">
    <div class="modal-title">📖 玩法說明</div>
    <ul class="modal-rules">
      <li data-n="1">滑動螢幕或使用方向鍵 / WASD 移動所有格子</li>
      <li data-n="2">相同食物碰在一起會合併升級成更高級的料理</li>
      <li data-n="3">目標是合成出最終的頂級盛宴 👑</li>
      <li data-n="4">復原可以悔棋一步</li>
    </ul>
    <div class="modal-section-title">食物進化圖鑑</div>
    <div id="help-food-grid"></div>
    <button class="modal-close-btn" id="help-close">關閉</button>
  </div>
</div>

<script src="sprites.js"></script>
<script src="game.js"></script>
<script>
  // Build board cells
  const board = document.getElementById('board');
  for (let i = 0; i < 16; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    board.appendChild(cell);
  }
</script>
</body>
</html>
