function drawSprite(canvas, food, px) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = px * dpr;
  canvas.height = px * dpr;
  canvas.style.width  = px + 'px';
  canvas.style.height = px + 'px';
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const dot = (px * dpr) / 32;
  ctx.fillStyle = food.bg;
  ctx.fillRect(0, 0, px * dpr, px * dpr);
  food.px.forEach((row, r) => {
    for (let c = 0; c < 32; c++) {
      const ch = row[c];
      if (ch === '0') continue;
      ctx.fillStyle = food.pal[parseInt(ch) - 1] || '#000';
      ctx.fillRect(Math.round(c * dot), Math.round(r * dot),
                   Math.ceil(dot), Math.ceil(dot));
    }
  });
}

  card.className = 'card';
  const canvas = document.createElement('canvas');
  drawSprite(canvas, food, 128);
  const lv  = document.createElement('div'); lv.className = 'lv';  lv.textContent = 'Lv.' + (i + 1);
  const nm  = document.createElement('div'); nm.className = 'nm';  nm.textContent = food.name;
  card.appendChild(canvas); card.appendChild(lv); card.appendChild(nm);
  document.body.appendChild(card);
});
